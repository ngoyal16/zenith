version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - FRONTEND_URL=http://frontend:3001
    depends_on:
      - frontend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # Exposing ports is optional now since backend proxies them,
    # but keeping them exposed for direct access if needed during dev
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
    restart: unless-stopped
